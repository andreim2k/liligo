; KeyBridge Slate: LilyGo T5-4.7 S3 E-Paper Pro
[platformio]
boards_dir = boards

[env:slate]
; Same pin as the dongle firmware: Arduino core 2.x APIs (BLE std::string, task WDT).
platform = espressif32@6.9.0
board = T5-ePaper-S3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSLATE_VERSION='"0.24.0"'
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

; Development build: adds a USB serial port for logs and easy re-flashing.
; The corp laptop would see that port too, so release builds use [env:slate].
[env:slate-dev]
extends = env:slate
build_flags =
    ${env:slate.build_flags}
    -DSLATE_DEBUG
